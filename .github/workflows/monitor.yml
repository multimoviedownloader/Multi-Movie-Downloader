          SUPABASE_URL: "https://brpyyaclataxkdgkbskt.supabase.co"
          SUPABASE_KEY: "sb_publishable_GO-sp2LSA4bjKWcX2f8WAQ_p9GVA6Sc"
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
